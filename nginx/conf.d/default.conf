server {
    listen 80;
    server_name flex.ruktu.com;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        # index.html cambia seguido durante esta etapa del proyecto — sin
        # esto el navegador (sobre todo en celular) puede quedarse con una
        # copia vieja y "actualizar" con un gesto de scroll no fuerza una
        # recarga real. Forzamos revalidación siempre.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /evidence/ {
        alias /usr/share/nginx/html/evidence/;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (reemplazo de Supabase Realtime en /api/gemba_events/*/stream/*)
        # necesita buffering apagado y timeouts largos, si no el navegador
        # nunca ve los eventos a tiempo o la conexion se corta a los 60s.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
